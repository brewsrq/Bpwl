<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c1720">
  <meta name="description" content="Offline workout tracker for The Blueprint 12-week strength and fat-loss program.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Blueprint">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" href="icons/favicon.png">
  <link rel="stylesheet" href="styles.css">
  <title>The Blueprint Workout App</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button class="brand-button" data-action="go-today" aria-label="Go to today's workout">
        <span class="brand-mark">BP</span>
        <span class="brand-copy"><strong>The Blueprint</strong><small id="brand-cycle">Workout system</small></span>
      </button>
      <button id="session-timer-chip" class="timer-chip hidden" data-action="open-session" aria-label="Open active workout">
        <span class="timer-dot"></span><span id="session-timer-text">0:00</span>
      </button>
      <button class="icon-button" data-action="open-quick-add" aria-label="Quick add">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </header>

    <main id="main-content" class="main-content" tabindex="-1">
      <section id="view-today" class="view active" data-view="today"></section>
      <section id="view-program" class="view" data-view="program"></section>
      <section id="view-volume" class="view" data-view="volume"></section>
      <section id="view-calendar" class="view" data-view="calendar"></section>
      <section id="view-more" class="view" data-view="more"></section>
    </main>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button class="nav-item active" data-route="today">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10l8-6 8 6v10h-6v-6h-4v6z"/></svg><span>Workout</span>
      </button>
      <button class="nav-item" data-route="program">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></svg><span>Program</span>
      </button>
      <button class="nav-item" data-route="volume">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg><span>Volume</span>
      </button>
      <button class="nav-item" data-route="calendar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v15H4zM8 3v4M16 3v4M4 9h16"/></svg><span>Calendar</span>
      </button>
      <button class="nav-item" data-route="more">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg><span>More</span>
      </button>
    </nav>
  </div>

  <div id="rest-timer" class="rest-timer hidden" role="status" aria-live="polite">
    <div><small>REST</small><strong id="rest-timer-text">1:30</strong></div>
    <div class="rest-actions">
      <button data-action="rest-minus">-15</button>
      <button data-action="rest-skip">Skip</button>
      <button data-action="rest-plus">+15</button>
    </div>
  </div>

  <div id="modal-backdrop" class="modal-backdrop hidden" data-action="close-modal"></div>
  <section id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-handle"></div>
    <header class="modal-header"><h2 id="modal-title">Dialog</h2><button class="icon-button" data-action="close-modal" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
    <div id="modal-body" class="modal-body"></div>
  </section>

  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <input id="import-file" type="file" accept="application/json" hidden>

  <script src="data.js"></script>
  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
