<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c1720">
  <meta name="description" content="Offline workout tracker for The Blueprint 12-week strength and fat-loss program.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Blueprint">
  
  
  
  <style>
:root {
  color-scheme: dark;
  --bg: #071017;
  --bg-elevated: #0c1720;
  --panel: #101e28;
  --panel-2: #142530;
  --panel-3: #1a2d39;
  --text: #f3f7f8;
  --muted: #94a7b2;
  --line: #263b46;
  --accent: #44d6b1;
  --accent-2: #5eb8ff;
  --accent-soft: rgba(68,214,177,.14);
  --warning: #ffbd5a;
  --danger: #ff7474;
  --success: #58dea7;
  --input: #0a151d;
  --shadow: 0 16px 44px rgba(0,0,0,.34);
  --radius: 18px;
  --radius-sm: 12px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --max: 840px;
}

body.light {
  color-scheme: light;
  --bg: #eef3f5;
  --bg-elevated: #ffffff;
  --panel: #ffffff;
  --panel-2: #f5f8f9;
  --panel-3: #e9f0f2;
  --text: #13212a;
  --muted: #607580;
  --line: #d7e1e5;
  --accent: #0b9779;
  --accent-2: #287dc1;
  --accent-soft: rgba(11,151,121,.10);
  --warning: #b56c00;
  --danger: #c33838;
  --success: #11815e;
  --input: #f7fafb;
  --shadow: 0 16px 44px rgba(36,57,67,.15);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at 50% -15%, rgba(68,214,177,.11), transparent 42%), var(--bg);
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 16px;
  line-height: 1.45;
  overscroll-behavior-y: none;
}
button, input, select, textarea { font: inherit; }
button { color: inherit; }
button, [role="button"] { -webkit-tap-highlight-color: transparent; }
svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.hidden { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

.app-shell { min-height: 100vh; }
.topbar {
  position: fixed;
  inset: 0 0 auto 0;
  z-index: 30;
  min-height: calc(64px + var(--safe-top));
  padding: calc(8px + var(--safe-top)) 14px 8px;
  display: flex;
  align-items: center;
  gap: 10px;
  background: color-mix(in srgb, var(--bg-elevated) 92%, transparent);
  border-bottom: 1px solid color-mix(in srgb, var(--line) 72%, transparent);
  backdrop-filter: blur(18px);
}
.brand-button {
  min-width: 0;
  padding: 0;
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1;
  background: none;
  border: 0;
  text-align: left;
}
.brand-mark {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  flex: 0 0 38px;
  border-radius: 12px;
  color: #06120f;
  background: linear-gradient(135deg, var(--accent), #95f0d9);
  font-weight: 900;
  letter-spacing: -.04em;
}
.brand-copy { min-width: 0; display: flex; flex-direction: column; }
.brand-copy strong { font-size: 15px; line-height: 1.15; }
.brand-copy small { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.timer-chip {
  border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line));
  background: var(--accent-soft);
  border-radius: 999px;
  min-height: 38px;
  padding: 7px 11px;
  display: flex;
  align-items: center;
  gap: 7px;
  font-variant-numeric: tabular-nums;
  font-weight: 800;
}
.timer-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 5px rgba(68,214,177,.12); }
.icon-button {
  width: 42px;
  height: 42px;
  flex: 0 0 42px;
  display: grid;
  place-items: center;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--panel);
}
.icon-button svg { width: 21px; height: 21px; }

.main-content {
  width: min(100%, var(--max));
  margin: 0 auto;
  padding: calc(82px + var(--safe-top)) 14px calc(96px + var(--safe-bottom));
}
.view { display: none; animation: fadeIn .18s ease-out; }
.view.active { display: block; }
@keyframes fadeIn { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.bottom-nav {
  position: fixed;
  z-index: 35;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  width: min(100%, var(--max));
  padding: 7px 8px calc(7px + var(--safe-bottom));
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 2px;
  background: color-mix(in srgb, var(--bg-elevated) 94%, transparent);
  border: 1px solid var(--line);
  border-bottom: 0;
  border-radius: 20px 20px 0 0;
  backdrop-filter: blur(20px);
  box-shadow: 0 -12px 30px rgba(0,0,0,.22);
}
.nav-item {
  min-height: 58px;
  border: 0;
  background: transparent;
  border-radius: 13px;
  color: var(--muted);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  font-size: 11px;
  font-weight: 700;
}
.nav-item svg { width: 21px; height: 21px; }
.nav-item.active { color: var(--accent); background: var(--accent-soft); }

.page-header { margin: 4px 2px 18px; }
.page-header .eyebrow, .eyebrow { color: var(--accent); text-transform: uppercase; letter-spacing: .13em; font-size: 11px; font-weight: 900; }
.page-header h1 { margin: 4px 0 4px; font-size: clamp(25px, 7vw, 38px); line-height: 1.06; letter-spacing: -.035em; }
.page-header p { margin: 0; color: var(--muted); }
.section-title { display: flex; align-items: end; justify-content: space-between; gap: 14px; margin: 24px 2px 10px; }
.section-title h2 { margin: 0; font-size: 19px; letter-spacing: -.02em; }
.section-title p, .section-title small { margin: 0; color: var(--muted); }

.card {
  background: linear-gradient(180deg, color-mix(in srgb, var(--panel) 98%, white 2%), var(--panel));
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: 0 8px 24px rgba(0,0,0,.10);
}
.card + .card { margin-top: 12px; }
.card.soft { background: var(--panel-2); box-shadow: none; }
.card.accent { border-color: color-mix(in srgb, var(--accent) 42%, var(--line)); background: linear-gradient(135deg, var(--accent-soft), var(--panel) 65%); }
.card.warning { border-color: color-mix(in srgb, var(--warning) 42%, var(--line)); }
.card.danger { border-color: color-mix(in srgb, var(--danger) 42%, var(--line)); }
.card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.card-header h2, .card-header h3 { margin: 0; letter-spacing: -.02em; }
.card-header h2 { font-size: 20px; }
.card-header h3 { font-size: 17px; }
.card-header p { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
.card-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.button {
  min-height: 46px;
  padding: 10px 15px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--panel-2);
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  text-decoration: none;
  cursor: pointer;
}
.button:active, .icon-button:active, .nav-item:active { transform: translateY(1px); }
.button.primary { color: #071510; background: linear-gradient(135deg, var(--accent), #8becd4); border-color: transparent; }
.button.secondary { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); color: var(--accent); }
.button.ghost { background: transparent; }
.button.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--line)); background: rgba(255,116,116,.08); }
.button.small { min-height: 36px; padding: 7px 11px; border-radius: 11px; font-size: 13px; }
.button.block { width: 100%; }
.button[disabled] { opacity: .45; cursor: not-allowed; }
.link-button { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 800; }

.pill-row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 1px 7px; }
.pill-row::-webkit-scrollbar { display: none; }
.pill {
  flex: 0 0 auto;
  min-height: 38px;
  padding: 8px 12px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--muted);
  font-size: 13px;
  font-weight: 800;
}
.pill.active { background: var(--accent-soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.badge { display: inline-flex; align-items: center; min-height: 25px; padding: 4px 8px; border-radius: 999px; background: var(--panel-3); color: var(--muted); font-size: 11px; font-weight: 800; }
.badge.accent { color: var(--accent); background: var(--accent-soft); }
.badge.success { color: var(--success); background: rgba(88,222,167,.11); }
.badge.warning { color: var(--warning); background: rgba(255,189,90,.11); }

.selector-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label, .field-label { color: var(--muted); font-size: 12px; font-weight: 800; }
.input, .select, .textarea {
  width: 100%;
  min-height: 46px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: var(--input);
  color: var(--text);
  padding: 10px 12px;
  outline: none;
}
.textarea { min-height: 92px; resize: vertical; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input[type=number] { font-variant-numeric: tabular-nums; }
.input::placeholder, .textarea::placeholder { color: color-mix(in srgb, var(--muted) 64%, transparent); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.form-grid .span-2 { grid-column: 1 / -1; }
.helper { color: var(--muted); font-size: 12px; }

.status-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stat { border: 1px solid var(--line); border-radius: 15px; padding: 13px; background: var(--panel-2); }
.stat small { display: block; color: var(--muted); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }
.stat strong { display: block; margin-top: 3px; font-size: 22px; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.stat em { display: block; color: var(--muted); font-size: 11px; font-style: normal; }

.week-hero { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 14px; }
.week-hero h2 { margin: 4px 0; font-size: 24px; }
.week-hero p { margin: 0; color: var(--muted); }
.progress-ring { position: relative; --p: 0; width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--panel-3) 0); }
.progress-ring::before { content: ''; width: 56px; height: 56px; border-radius: 50%; background: var(--panel); position: absolute; }
.progress-ring span { position: relative; z-index: 1; font-size: 13px; font-weight: 900; }

.workout-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.workout-controls .button:last-child:nth-child(odd) { grid-column: 1 / -1; }
.session-banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; padding: 12px 14px; border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius: 14px; background: var(--accent-soft); }
.session-banner strong { font-variant-numeric: tabular-nums; font-size: 20px; }

.exercise-card { padding: 0; overflow: hidden; }
.exercise-card + .exercise-card { margin-top: 12px; }
.exercise-head { padding: 15px 15px 12px; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.exercise-index { display: flex; gap: 11px; min-width: 0; }
.exercise-number { width: 30px; height: 30px; flex: 0 0 30px; display: grid; place-items: center; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 900; }
.exercise-title { min-width: 0; }
.exercise-title h3 { margin: 0; font-size: 17px; line-height: 1.2; }
.exercise-title .meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
.exercise-menu { border: 0; background: transparent; width: 38px; height: 38px; display: grid; place-items: center; color: var(--muted); font-size: 22px; }
.suggestion { margin: 0 15px 12px; border-radius: 13px; padding: 11px 12px; background: var(--panel-2); border: 1px solid var(--line); }
.suggestion strong { display: block; color: var(--accent-2); font-size: 13px; }
.suggestion p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
.suggestion .set-change { color: var(--warning); }
.set-table { border-top: 1px solid var(--line); }
.set-head, .set-row { display: grid; grid-template-columns: 34px minmax(70px, 1.05fr) minmax(62px, .8fr) minmax(58px, .72fr) 46px; gap: 7px; align-items: center; padding: 8px 12px; }
.set-head { color: var(--muted); font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: .05em; background: var(--panel-2); }
.set-row { border-top: 1px solid color-mix(in srgb, var(--line) 72%, transparent); }
.set-row.complete { background: rgba(88,222,167,.06); }
.set-number { text-align: center; font-weight: 900; color: var(--muted); }
.set-input { width: 100%; min-width: 0; height: 43px; border: 1px solid var(--line); border-radius: 11px; background: var(--input); color: var(--text); padding: 7px; text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; }
.set-input:focus { outline: none; border-color: var(--accent); }
.set-input::placeholder { font-size: 11px; color: color-mix(in srgb, var(--muted) 55%, transparent); }
.complete-set { width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2); display: grid; place-items: center; color: var(--muted); }
.complete-set svg { width: 21px; height: 21px; }
.set-row.complete .complete-set { color: #04100d; background: var(--success); border-color: transparent; }
.exercise-foot { display: flex; gap: 8px; padding: 10px 12px 13px; border-top: 1px solid var(--line); }
.exercise-foot .button { flex: 1; }

.week-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.week-cell { min-height: 62px; border: 1px solid var(--line); border-radius: 13px; background: var(--panel); padding: 8px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; }
.week-cell strong { font-size: 14px; }
.week-cell small { color: var(--muted); font-size: 10px; }
.week-cell.active { border-color: var(--accent); background: var(--accent-soft); }
.week-cell.complete { box-shadow: inset 0 -3px var(--success); }

.program-day { margin-top: 10px; }
.program-day summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 15px; border: 1px solid var(--line); background: var(--panel); border-radius: 15px; }
.program-day summary::-webkit-details-marker { display: none; }
.program-day[open] summary { border-radius: 15px 15px 0 0; border-bottom-color: transparent; }
.program-day-body { border: 1px solid var(--line); border-top: 0; border-radius: 0 0 15px 15px; overflow: hidden; }
.program-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 11px 13px; border-top: 1px solid var(--line); }
.program-row:first-child { border-top: 0; }
.program-row p { margin: 0; }
.program-row small { display: block; color: var(--muted); }

.volume-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 14px; background: var(--panel-2); }
.volume-toggle button { min-height: 38px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-weight: 800; }
.volume-toggle button.active { background: var(--panel); color: var(--text); box-shadow: 0 4px 14px rgba(0,0,0,.14); }
.bar-list { display: flex; flex-direction: column; gap: 12px; }
.bar-row { display: grid; grid-template-columns: 94px 1fr 56px; gap: 10px; align-items: center; }
.bar-row label { font-size: 13px; font-weight: 800; }
.bar-track { height: 12px; border-radius: 999px; background: var(--panel-3); overflow: hidden; }
.bar-fill { height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
.bar-value { text-align: right; font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); }
.volume-table { width: 100%; border-collapse: collapse; }
.volume-table th, .volume-table td { padding: 10px 8px; border-bottom: 1px solid var(--line); }
.volume-table th { color: var(--muted); font-size: 10px; text-align: right; text-transform: uppercase; letter-spacing: .06em; }
.volume-table th:first-child, .volume-table td:first-child { text-align: left; }
.volume-table td { text-align: right; font-variant-numeric: tabular-nums; }

.calendar-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.calendar-toolbar h2 { margin: 0; font-size: 20px; }
.calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; min-width: 0; }
.calendar-weekday { text-align: center; color: var(--muted); font-size: 10px; font-weight: 900; padding: 6px 0; }
.calendar-day { position: relative; aspect-ratio: 1; min-width: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--panel-2); padding: 7px; text-align: left; font-size: 12px; }
.calendar-day.outside { opacity: .32; }
.calendar-day.today { border-color: var(--accent-2); }
.calendar-day.has-gym { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
.calendar-day .day-num { font-weight: 900; }
.calendar-day .dots { position: absolute; left: 7px; right: 7px; bottom: 6px; display: flex; gap: 3px; }
.calendar-day .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.calendar-day .time { position: absolute; right: 6px; bottom: 4px; color: var(--muted); font-size: 8px; }

.time-chart { display: flex; align-items: flex-end; gap: 6px; height: 150px; padding: 8px 3px 0; }
.time-bar-wrap { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; }
.time-bar { width: 100%; max-width: 34px; min-height: 3px; border-radius: 7px 7px 3px 3px; background: linear-gradient(180deg, var(--accent-2), var(--accent)); }
.time-bar-wrap small { color: var(--muted); font-size: 9px; }

.list { display: flex; flex-direction: column; }
.list-item { min-height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.list-item:last-child { border-bottom: 0; }
.list-copy { min-width: 0; }
.list-copy strong { display: block; }
.list-copy small { display: block; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-chevron { color: var(--muted); font-size: 22px; }

.muscle-credit-row { display: grid; grid-template-columns: minmax(0, 1fr) 94px 42px; gap: 8px; align-items: end; margin-top: 8px; }
.credit-input-wrap { position: relative; }
.credit-input-wrap .input { padding-right: 28px; }
.credit-input-wrap span { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 12px; }

.modal-backdrop { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,.58); backdrop-filter: blur(4px); }
.modal {
  position: fixed;
  z-index: 90;
  left: 50%;
  bottom: 0;
  width: min(100%, 720px);
  max-height: min(88vh, 840px);
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  background: var(--bg-elevated);
  border: 1px solid var(--line);
  border-bottom: 0;
  border-radius: 24px 24px 0 0;
  box-shadow: var(--shadow);
  padding-bottom: var(--safe-bottom);
  animation: slideUp .2s ease-out;
}
@keyframes slideUp { from { transform: translate(-50%, 20px); opacity: .5; } to { transform: translate(-50%, 0); opacity: 1; } }
.modal-handle { width: 42px; height: 5px; border-radius: 999px; background: var(--line); margin: 9px auto 0; }
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 15px; border-bottom: 1px solid var(--line); }
.modal-header h2 { margin: 0; font-size: 19px; }
.modal-body { padding: 15px; overflow-y: auto; overscroll-behavior: contain; }
.modal-body > :first-child { margin-top: 0; }
.modal-footer { position: sticky; bottom: 0; display: flex; gap: 9px; padding: 12px 0 2px; background: linear-gradient(transparent, var(--bg-elevated) 24%); }
.modal-footer .button { flex: 1; }

.rest-timer {
  position: fixed;
  z-index: 60;
  left: 50%;
  bottom: calc(82px + var(--safe-bottom));
  transform: translateX(-50%);
  width: min(calc(100% - 24px), 560px);
  display: flex;
  align-items: center;

  backdrop-filter: blur(18px);

.rest-actions button { min-height: 38px; border: 1px solid var(--line); border-radius: 11px; background: var(--panel-2); font-size: 12px; font-weight: 800; }

.toast-region { position: fixed; z-index: 120; top: calc(72px + var(--safe-top)); left: 50%; transform: translateX(-50%); width: min(calc(100% - 28px), 600px); pointer-events: none; }
.toast { margin-top: 8px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); box-shadow: var(--shadow); font-weight: 700; animation: toastIn .2s ease-out; }
.toast.success { border-color: color-mix(in srgb, var(--success) 50%, var(--line)); }
.toast.error { border-color: color-mix(in srgb, var(--danger) 50%, var(--line)); }
@keyframes toastIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

.empty { text-align: center; padding: 32px 18px; color: var(--muted); }
.empty strong { display: block; color: var(--text); margin-bottom: 4px; }
.divider { height: 1px; background: var(--line); margin: 18px 0; }
.inline-note { padding: 11px 12px; border-radius: 12px; background: var(--panel-2); color: var(--muted); font-size: 12px; }
.check-row { display: flex; align-items: center; gap: 10px; min-height: 44px; }

      action = 'hold';
      result.headline = `Hold ${suggestedWeight} ${state.profile.unit}; add a clean rep`;
      result.reason = 'Keep the load and try to improve total repetitions while staying inside the prescribed range and RIR.';
    } else {
      result.headline = `Repeat the movement and aim for ${p.repMin}-${p.repMax} reps`;
      result.reason = 'The previous entry did not include a usable load.';
    }

    for (let i = 0; i < Number(p.sets); i += 1) {
      const prev = previousSets[Math.min(i, previousSets.length - 1)];
      let targetReps = Number(p.repMin);
      if (action === 'hold' && prev) targetReps = Math.min(Number(p.repMax), Math.max(Number(p.repMin), Number(prev.reps || p.repMin) + 1));
      result.perSet.push({ weight: suggestedWeight, reps: targetReps });
    }

    if (setChange.delta > 0) {
      result.reason += ` The program adds ${setChange.delta} set${setChange.delta === 1 ? '' : 's'} versus the prior week.`;
    } else if (setChange.delta < 0) {
      result.reason += ` The program removes ${Math.abs(setChange.delta)} set${setChange.delta === -1 ? '' : 's'} this week to manage fatigue.`;
    }
    result.load = suggestedWeight;
    return result;
  }

  function getMuscleGroup(muscle) {
    return Object.keys(D.MUSCLE_GROUPS).find(group => D.MUSCLE_GROUPS[group].includes(muscle)) || 'Other';
  }

  function sessionInWeek(session, cycleId, weekNumber) {
    return session.cycleId === cycleId && Number(session.week) === Number(weekNumber) && session.status !== 'discarded';
  }

  function calculateWeeklyVolume(state, cycleId, weekNumber, mode) {
    const muscle = {};
    const group = {};
    D.MUSCLES.forEach(m => { muscle[m] = { reps: 0, sets: 0, rawSets: 0 }; });
    Object.keys(D.MUSCLE_GROUPS).forEach(g => { group[g] = { reps: 0, sets: 0, rawSets: 0 }; });
    const cycle = getCycle(state, cycleId);
    const usePlanned = mode === 'planned';

    function add(exercise, reps, setCredit) {
      (exercise.muscles || []).forEach(mc => {
        const credit = Math.max(0, Math.min(1, Number(mc.credit) || 0));
        if (!muscle[mc.muscle]) muscle[mc.muscle] = { reps: 0, sets: 0, rawSets: 0 };
        muscle[mc.muscle].reps += Number(reps) * credit;
        muscle[mc.muscle].sets += Number(setCredit) * credit;
        muscle[mc.muscle].rawSets += Number(setCredit);
        const g = getMuscleGroup(mc.muscle);
        if (!group[g]) group[g] = { reps: 0, sets: 0, rawSets: 0 };
        group[g].reps += Number(reps) * credit;
        group[g].sets += Number(setCredit) * credit;
        group[g].rawSets += Number(setCredit);
      });
    }

    if (usePlanned) {
      const week = getWeek(cycle, weekNumber);
      if (week) week.days.forEach(day => day.prescriptions.forEach(p => {
        const ex = getExercise(state, p.exerciseId);
        if (!ex) return;
        const midpoint = (Number(p.repMin) + Number(p.repMax)) / 2;
        for (let i = 0; i < Number(p.sets); i += 1) add(ex, midpoint, 1);
      }));
    } else {
      state.sessions.filter(s => sessionInWeek(s, cycleId, weekNumber)).forEach(session => {
        session.exercises.forEach(se => {
          const mapping = { muscles: se.musclesSnapshot || (getExercise(state, se.exerciseId) || {}).muscles || [] };
          completedWorkingSets(se).forEach(set => add(mapping, Number(set.reps) || 0, 1));
        });
      });
    }

    const round = obj => Object.fromEntries(Object.entries(obj).map(([k, v]) => [k, {
      reps: Math.round(v.reps),
      sets: Math.round(v.sets * 10) / 10,
      rawSets: Math.round(v.rawSets * 10) / 10
    }]));
    return { muscle: round(muscle), group: round(group), mode: usePlanned ? 'planned' : 'completed' };
  }

  function groupCreditsForExercise(exercise) {
    const out = {};
    (exercise.muscles || []).forEach(mc => {
      const g = getMuscleGroup(mc.muscle);
      out[g] = (out[g] || 0) + Number(mc.credit || 0);
    });
    return out;
  }

  function parseFocusText(text) {
    const lower = String(text || '').toLowerCase();
    const focus = new Set();
    const reduce = new Set();
    // Split on punctuation and conjunctions that usually introduce a new instruction.
    const clauses = lower.split(/[.;\n]|\bbut\b|\bwhile\b/).map(x => x.trim()).filter(Boolean);
    clauses.forEach(clause => {
      const isReduce = /\b(reduce|less|deemphas(?:ize|ise)?|minimum|minimal|maintain(?:ing|ed|s)?(?: only)?|cut back)\b/.test(clause);
      const isFocus = /\b(focus|emphas(?:ize|ise)|priority|prioriti[sz]e|more)\b/.test(clause);
      Object.keys(GROUP_ALIASES).forEach(alias => {
        const safe = alias.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        if (!new RegExp(`\\b${safe}\\b`, 'i').test(clause)) return;
        const groupName = GROUP_ALIASES[alias];
        if (isReduce && !isFocus) reduce.add(groupName);
        else focus.add(groupName);
      });
    });
    // Handle phrases such as "focus back and shoulders, reduce legs" by parsing the
    // text segments on each side of a reduction keyword separately.
    const reductionMatch = lower.match(/^(.*?)(?:,|;)?\s*\b(reduce|less|deemphas(?:ize|ise)?|minimum|minimal|maintain(?:ing|ed|s)?(?: only)?|cut back)\b(.*)$/);
    if (reductionMatch) {
      const before = reductionMatch[1];
      const after = reductionMatch[3];
      Object.keys(GROUP_ALIASES).forEach(alias => {
        const safe = alias.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const re = new RegExp(`\\b${safe}\\b`, 'i');
        const groupName = GROUP_ALIASES[alias];
        if (re.test(before)) focus.add(groupName);
        if (re.test(after)) reduce.add(groupName);
      });
    }
    reduce.forEach(g => focus.delete(g));
    return { focus: Array.from(focus), reduce: Array.from(reduce) };
  }

  function fullVolumeTemplate(cycle) {
    const preferred = getWeek(cycle, 5) || getWeek(cycle, 4) || getWeek(cycle, 3) || cycle.weeks[0];
    return deepClone(preferred.days);
  }

  function scaleSets(baseSets, weekNumber) {
    const b = Number(baseSets) || 1;
    if (weekNumber <= 2) return Math.max(1, Math.min(2, b));
    if (weekNumber === 8) return Math.max(1, Math.ceil(b * 0.55));
    if (weekNumber === 12) return Math.max(1, Math.ceil(b * 0.6));
    return b;
  }

  function phaseForWeek(weekNumber) {
    const map = {
      1: ['Re-entry I', 3, 4, 'Use conservative loads and establish repeatable technique.'],
      2: ['Re-entry II', 3, 3, 'Add reps before load and keep soreness manageable.'],
      3: ['Build I', 2, 3, 'Move to full productive volume.'],
      4: ['Build II', 2, 2, 'Continue double progression without chasing failure.'],
      5: ['Progress I', 1, 2, 'Beat one or more prior set performances with clean form.'],
      6: ['Progress II', 1, 2, 'Add load only after earning the top of the range.'],
      7: ['Progress III', 1, 2, 'Hardest accumulation week; keep compounds shy of failure.'],
      8: ['Pivot', 3, 4, 'Reduce set count and load to manage fatigue.'],
      9: ['Strength-Hypertrophy I', 2, 2, 'Use heavier primary work and controlled accessories.'],
      10: ['Strength-Hypertrophy II', 1, 2, 'Progress primary lifts without sacrificing range.'],
      11: ['Strength-Hypertrophy III', 1, 2, 'Peak week without grinders or maximal testing.'],
      12: ['Consolidate', 2, 3, 'Finish recovered and compare performance quality.']
    };
    const x = map[weekNumber];
    return { block: x[0], rirMin: x[1], rirMax: x[2], note: x[3] };
  }

  function adjustRepRangeForPhase(p, ex, weekNumber) {
    const out = deepClone(p);
    if (weekNumber >= 9 && weekNumber <= 11 && ex && ex.category === 'Compound') {
      out.repMin = Math.max(3, Number(out.repMin) - 1);
      out.repMax = Math.max(out.repMin + 1, Number(out.repMax) - 2);
    }
    if (weekNumber === 12 && ex && ex.category === 'Compound') {
      out.repMin = Math.max(4, Number(out.repMin));
    }
    return out;
  }

  function generateRefocusCycle(state, options) {
    const opts = options || {};
    const source = getCycle(state, opts.sourceCycleId || state.activeCycleId);
    if (!source) throw new Error('No source cycle available.');
    const focusGroups = Array.from(new Set((opts.focusGroups || []).filter(g => D.MUSCLE_GROUPS[g])));
    const reduceGroups = Array.from(new Set((opts.reduceGroups || []).filter(g => D.MUSCLE_GROUPS[g] && !focusGroups.includes(g))));
    const templateDays = fullVolumeTemplate(source);

    // Identify the strongest prescriptions for focus and de-emphasis by group credit.
    templateDays.forEach(day => {
      day.prescriptions.forEach(p => {
        const ex = getExercise(state, p.exerciseId);
        p._groupCredits = ex ? groupCreditsForExercise(ex) : {};
      });
      focusGroups.forEach(groupName => {
        const candidates = day.prescriptions
          .filter(p => (p._groupCredits[groupName] || 0) > 0)
          .sort((a, b) => (b._groupCredits[groupName] || 0) - (a._groupCredits[groupName] || 0));
        if (candidates.length) candidates[0]._focusBonus = (candidates[0]._focusBonus || 0) + 1;
      });
      reduceGroups.forEach(groupName => {
        const candidates = day.prescriptions
          .filter(p => (p._groupCredits[groupName] || 0) >= 0.7 && Number(p.sets) > 1 && !(p._focusBonus > 0))
          .sort((a, b) => (b._groupCredits[groupName] || 0) - (a._groupCredits[groupName] || 0));
        if (candidates.length) candidates[candidates.length - 1]._reduce = (candidates[candidates.length - 1]._reduce || 0) + 1;
      });
      // Bring focus work earlier without displacing the first compound lift.
      if (focusGroups.length) {
        const firstFocusIndex = day.prescriptions.findIndex(p => focusGroups.some(g => (p._groupCredits[g] || 0) > 0.7));
        if (firstFocusIndex > 1) {
          const [item] = day.prescriptions.splice(firstFocusIndex, 1);
          day.prescriptions.splice(1, 0, item);
        }
      }
    });

    const weeks = [];
    for (let w = 1; w <= 12; w += 1) {
      const phase = phaseForWeek(w);
      const days = templateDays.map((day, dayIdx) => {
        const upperPriority = focusGroups.filter(g => ['Chest','Back','Shoulders','Arms'].includes(g));
        const lowerPriority = focusGroups.filter(g => ['Legs','Core','Arms'].includes(g));
        const baseLabel = dayIdx % 2 === 0 ? `Upper ${dayIdx === 0 ? 'A' : 'B'}` : `Lower ${dayIdx === 1 ? 'A' : 'B'}`;
        const relevant = dayIdx % 2 === 0 ? upperPriority : lowerPriority;
        const generatedTitle = relevant.length ? `${baseLabel} - ${relevant.join(' + ')} Priority` : day.title;
        return {
        id: day.id || `D${dayIdx + 1}`,
        title: generatedTitle,
        focus: focusGroups.length ? `${focusGroups.join(' + ')} priority` : day.focus,
        prescriptions: day.prescriptions.map((base, idx) => {
          const ex = getExercise(state, base.exerciseId);
          let fullSets = Number(base.sets) + Number(base._focusBonus || 0) - Number(base._reduce || 0);
          fullSets = Math.max(1, Math.min(4, fullSets));
          let scaled = scaleSets(fullSets, w);
          // Re-entry weeks never exceed two sets; pivot/consolidation preserve the drop.
          if (w <= 2) scaled = Math.min(2, scaled);
          let p = Object.assign({}, base, {
            id: `w${w}-d${dayIdx + 1}-${idx + 1}-${uid('rx').slice(-5)}`,
            sets: scaled,
            rirMin: phase.rirMin,
            rirMax: phase.rirMax,
            order: idx + 1
          });
          p = adjustRepRangeForPhase(p, ex, w);
          delete p._groupCredits; delete p._focusBonus; delete p._reduce;
          return p;
        })
      };
      });
      weeks.push({ number: w, block: phase.block, rirLabel: phase.rirMin === phase.rirMax ? `${phase.rirMin} RIR` : `${phase.rirMin}-${phase.rirMax} RIR`, note: phase.note, days });
    }

    return {
      id: uid('cycle'),
      name: opts.name || `${focusGroups.length ? focusGroups.join(' + ') : 'Balanced'} Focus Cycle`,
      createdAt: new Date().toISOString(),
      startDate: opts.startDate || null,
      status: 'draft',
      focusGroups,
      deemphasisGroups: reduceGroups,
      description: `Generated from ${source.name}. Priority: ${focusGroups.join(', ') || 'balanced'}. Reduced emphasis: ${reduceGroups.join(', ') || 'none'}.`,
      weeks
    };
  }

  function replaceExerciseInCycle(state, cycleId, oldExerciseId, newExerciseId, startWeek, scope, dayId) {
    const cycle = getCycle(state, cycleId);
    if (!cycle) return 0;
    let changed = 0;
    const start = Number(startWeek) || 1;
    cycle.weeks.forEach(week => {
      if (scope === 'occurrence' && Number(week.number) !== start) return;
      if (scope !== 'all' && Number(week.number) < start) return;
      week.days.forEach(day => {
        if (dayId && day.id !== dayId) return;
        day.prescriptions.forEach(p => {
          if (p.exerciseId === oldExerciseId) {
            p.exerciseId = newExerciseId;
            const ex = getExercise(state, newExerciseId);
            p.displayName = ex ? ex.name : p.displayName;
            changed += 1;
          }
        });
      });
    });
    return changed;
  }

  function updatePrescription(state, cycleId, weekNumber, dayId, prescriptionId, patch) {
    const day = getDay(getCycle(state, cycleId), weekNumber, dayId);
    if (!day) return false;
    const p = day.prescriptions.find(x => x.id === prescriptionId);
    if (!p) return false;
    Object.assign(p, patch);
    p.sets = Math.max(1, Math.min(8, Number(p.sets) || 1));
    p.repMin = Math.max(1, Number(p.repMin) || 1);
    p.repMax = Math.max(p.repMin, Number(p.repMax) || p.repMin);
    return true;
  }

  function addOrUpdateGymVisit(state, date, patch) {
    const d = date || todayISO();
    let visit = state.gymVisits.find(v => v.date === d && !v.sessionId);
    if (!visit) {
      visit = { id: uid('visit'), date: d, type: 'manual', durationSec: 0, notes: '', createdAt: new Date().toISOString() };
      state.gymVisits.push(visit);
    }
    Object.assign(visit, patch || {});
    return visit;
  }

  function allGymVisits(state) {
    const sessionVisits = state.sessions.filter(s => s.status === 'completed').map(s => ({
      id: `session-${s.id}`,
      date: s.date,
      type: 'session',
      durationSec: Number(s.durationSec) || 0,
      notes: s.dayTitle || '',
      sessionId: s.id
    }));
    return sessionVisits.concat(state.gymVisits || []).sort((a, b) => String(a.date).localeCompare(String(b.date)));
  }

  function timeStats(state, referenceDate) {
    const ref = referenceDate ? new Date(referenceDate) : new Date();
    const weekStart = startOfWeek(ref, state.profile.weekStartsMonday !== false);
    const weekEnd = endOfWeek(ref, state.profile.weekStartsMonday !== false);
    const monthStart = new Date(ref.getFullYear(), ref.getMonth(), 1);
    const monthEnd = new Date(ref.getFullYear(), ref.getMonth() + 1, 0, 23, 59, 59, 999);
    const yearStart = new Date(ref.getFullYear(), 0, 1);
    const yearEnd = new Date(ref.getFullYear(), 11, 31, 23, 59, 59, 999);
    const visits = allGymVisits(state);
    const summarize = (from, to) => {
      const filtered = visits.filter(v => {
        const d = parseISODate(v.date);
        return d && d >= from && d <= to;
      });
      return { count: filtered.length, seconds: filtered.reduce((sum, v) => sum + (Number(v.durationSec) || 0), 0) };
    };
    return {
      week: summarize(weekStart, weekEnd),
      month: summarize(monthStart, monthEnd),
      year: summarize(yearStart, yearEnd),
      all: { count: visits.length, seconds: visits.reduce((sum, v) => sum + (Number(v.durationSec) || 0), 0) }
    };
  }

  function weeklyTimeSeries(state, weeksBack) {
    const count = Number(weeksBack) || 12;
    const out = [];
    const current = startOfWeek(new Date(), state.profile.weekStartsMonday !== false);
    const visits = allGymVisits(state);
    for (let i = count - 1; i >= 0; i -= 1) {
      const start = new Date(current);
      start.setDate(start.getDate() - i * 7);
      const end = new Date(start);
      end.setDate(end.getDate() + 6);
      end.setHours(23, 59, 59, 999);
      const seconds = visits.filter(v => {
        const d = parseISODate(v.date);
        return d && d >= start && d <= end;
      }).reduce((sum, v) => sum + (Number(v.durationSec) || 0), 0);
      out.push({ start: isoDate(start), label: `${start.getMonth() + 1}/${start.getDate()}`, seconds });
    }
    return out;
  }

  function rollingWeightAverage(state, endDate, days) {
    const end = parseISODate(endDate || todayISO()) || new Date();
    const start = new Date(end);
    start.setDate(start.getDate() - (Number(days) || 7) + 1);
    const values = state.weighIns.filter(w => {
      const d = parseISODate(w.date);
      return d && d >= start && d <= end && Number.isFinite(Number(w.weight));
    }).map(w => Number(w.weight));
    return values.length ? values.reduce((a, b) => a + b, 0) / values.length : null;
  }

  function upsertByDate(collection, date, record) {
    const idx = collection.findIndex(x => x.date === date);
    if (idx >= 0) collection[idx] = Object.assign(collection[idx], record, { date });
    else collection.push(Object.assign({ id: uid('entry'), date }, record));
    collection.sort((a, b) => String(a.date).localeCompare(String(b.date)));
  }

  function csvEscape(value) {
    if (value == null) return '';
    const s = String(value);
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  }

  function toCSV(rows) {
    return rows.map(row => row.map(csvEscape).join(',')).join('\n');
  }

  function exportSessionsCSV(state) {
    const rows = [['Date','Cycle','Week','Day','Session duration min','Exercise','Set','Weight','Reps','RIR','Completed']];
    state.sessions.filter(s => s.status === 'completed').forEach(s => {
      s.exercises.forEach(se => se.sets.forEach(set => {
        if (!set.completed) return;
        rows.push([s.date,s.cycleName,s.week,s.dayId,Math.round((Number(s.durationSec)||0)/60),se.exerciseName,set.number,set.weight,set.reps,set.rir,'Yes']);
      }));
    });
    return toCSV(rows);
  }

  function exportWeightsCSV(state) {
    const rows = [['Date','Weight']].concat(state.weighIns.map(w => [w.date,w.weight]));
    return toCSV(rows);
  }

  function exportMeasurementsCSV(state) {
    const rows = [['Date','Weight','Waist','Chest','Arm','Thigh','Hips','Neck','Notes']];
    state.measurements.forEach(m => rows.push([m.date,m.weight,m.waist,m.chest,m.arm,m.thigh,m.hips,m.neck,m.notes]));
    return toCSV(rows);
  }

  function exportVisitsCSV(state) {
    const rows = [['Date','Type','Duration min','Notes']];
    allGymVisits(state).forEach(v => rows.push([v.date,v.type,Math.round((Number(v.durationSec)||0)/60),v.notes]));
    return toCSV(rows);
  }

  function validateState(state) {
    const errors = [];
    if (!state || !Array.isArray(state.exercises)) errors.push('Exercise library is missing.');
    if (!state || !Array.isArray(state.cycles)) errors.push('Program cycles are missing.');
    (state.exercises || []).forEach(ex => {
      if (!ex.id || !ex.name) errors.push('An exercise is missing an id or name.');
      (ex.muscles || []).forEach(mc => {
        if (!D.MUSCLES.includes(mc.muscle)) errors.push(`${ex.name}: unknown muscle ${mc.muscle}.`);
        if (Number(mc.credit) < 0 || Number(mc.credit) > 1) errors.push(`${ex.name}: muscle credit must be 0-1.`);
      });
    });
    (state.cycles || []).forEach(cycle => {
      (cycle.weeks || []).forEach(week => (week.days || []).forEach(day => (day.prescriptions || []).forEach(p => {
        if (!getExercise(state, p.exerciseId)) errors.push(`${cycle.name} W${week.number} ${day.id}: missing exercise ${p.exerciseId}.`);
        if (Number(p.sets) < 1 || Number(p.repMin) < 1 || Number(p.repMax) < Number(p.repMin)) errors.push(`${cycle.name} W${week.number} ${day.id}: invalid prescription.`);
      })));
    });
    return errors;
  }

  const API = {
    DATA: D,
    STORAGE_KEY,
    uid,
    deepClone,
    isoDate,
    todayISO,
    parseISODate,
    startOfWeek,
    endOfWeek,
    formatDuration,
    roundToIncrement,
    defaultState,
    migrateState,
    loadState,
    saveState,
    getActiveCycle,
    getCycle,
    getExercise,
    getWeek,
    getDay,
    prescriptionTargetText,
    rirText,
    currentElapsedSeconds,
    restRemainingSeconds,
    createSession,
    getSession,
    findSessionForProgramDay,
    completedWorkingSets,
    findLastExercisePerformance,
    calculateSuggestion,
    calculateWeeklyVolume,
    getMuscleGroup,
    parseFocusText,
    generateRefocusCycle,
    replaceExerciseInCycle,
    updatePrescription,
    addOrUpdateGymVisit,
    allGymVisits,
    timeStats,
    weeklyTimeSeries,
    rollingWeightAverage,
    upsertByDate,
    exportSessionsCSV,
    exportWeightsCSV,
    exportMeasurementsCSV,
    exportVisitsCSV,
    toCSV,
    validateState
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = API;
  global.BlueprintCore = API;
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>
(function () {
  'use strict';

  const C = window.BlueprintCore;
  let state = C.loadState();
  let currentRoute = 'today';
  let volumeMode = 'completed';
  let installPrompt = null;
  let modalContext = null;
  let tickHandle = null;

  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
  const esc = value => String(value == null ? '' : value)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
  const num = value => value === '' || value == null ? '' : Number(value);
  const fmt1 = value => Number.isFinite(Number(value)) ? Number(value).toFixed(1).replace(/\.0$/, '') : '—';
  const fmtDate = value => {
    const d = C.parseISODate(value);
    return d ? d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
  };
  const fmtMonth = ym => {
    const [y, m] = ym.split('-').map(Number);
    return new Date(y, m - 1, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
  };

  function persist(render = false) {
    C.saveState(state);
    if (render) renderAll();
  }

  function toast(message, type) {
    const region = $('#toast-region');
    const el = document.createElement('div');
    el.className = `toast ${type || ''}`;
    el.textContent = message;
    region.appendChild(el);
    setTimeout(() => el.remove(), 3200);
  }

  function openModal(title, html, context) {
    modalContext = context || null;
    $('#modal-title').textContent = title;
    $('#modal-body').innerHTML = html;
    $('#modal-backdrop').classList.remove('hidden');
    $('#modal').classList.remove('hidden');
    document.body.style.overflow = 'hidden';
    setTimeout(() => {
      const focusable = $('#modal-body input:not([type="hidden"]), #modal-body select, #modal-body button');
      if (focusable) focusable.focus({ preventScroll: true });
    }, 50);
  }

  function closeModal() {
    $('#modal-backdrop').classList.add('hidden');
    $('#modal').classList.add('hidden');
    document.body.style.overflow = '';
    modalContext = null;
  }

  function applyTheme() {
    document.body.classList.toggle('light', state.profile.theme === 'light');
    document.querySelector('meta[name="theme-color"]').setAttribute('content', state.profile.theme === 'light' ? '#ffffff' : '#0c1720');
  }

  function routeTo(route) {
    currentRoute = route;
    $$('.view').forEach(v => v.classList.toggle('active', v.dataset.view === route));
    $$('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.route === route));
    renderRoute(route);
    $('#main-content').focus({ preventScroll: true });
    window.scrollTo({ top: 0, behavior: 'instant' });
  }

  function renderRoute(route) {
    if (route === 'today') renderToday();
    else if (route === 'program') renderProgram();
    else if (route === 'volume') renderVolume();
    else if (route === 'calendar') renderCalendar();
    else renderMore();
    updateHeader();
  }

  function renderAll() {
    applyTheme();
    $$('.view').forEach(v => v.classList.toggle('active', v.dataset.view === currentRoute));
    $$('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.route === currentRoute));
    renderRoute(currentRoute);
    updateTimers();
  }

  function updateHeader() {
    const cycle = C.getActiveCycle(state);
    $('#brand-cycle').textContent = cycle ? cycle.name : 'Workout system';
  }

  function sessionForSelection() {
    const cycle = C.getActiveCycle(state);
    if (!cycle) return null;
    if (state.activeSessionId) {
      const active = C.getSession(state, state.activeSessionId);
      if (active && active.cycleId === cycle.id && Number(active.week) === Number(state.ui.selectedWeek) && active.dayId === state.ui.selectedDay) return active;
    }
    const matches = state.sessions.filter(s => s.cycleId === cycle.id && Number(s.week) === Number(state.ui.selectedWeek) && s.dayId === state.ui.selectedDay && s.status !== 'discarded');
    matches.sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
    return matches[0] || null;
  }

  function completedDaysForWeek(cycleId, week) {
    return new Set(state.sessions.filter(s => s.cycleId === cycleId && Number(s.week) === Number(week) && s.status === 'completed').map(s => s.dayId));
  }

  function weekCompletionPercent(cycle, week) {
    const done = completedDaysForWeek(cycle.id, week).size;
    const total = (C.getWeek(cycle, week) || { days: [] }).days.length || 4;
    return Math.round((done / total) * 100);
  }

  function renderToday() {
    const root = $('#view-today');
    const cycle = C.getActiveCycle(state);
    if (!cycle) {
      root.innerHTML = '<div class="empty"><strong>No active program</strong>Build or activate a cycle from Program.</div>';
      return;
    }
    const weekNum = Number(state.ui.selectedWeek || 1);
    const week = C.getWeek(cycle, weekNum) || cycle.weeks[0];
    const dayId = state.ui.selectedDay || 'D1';
    const day = C.getDay(cycle, week.number, dayId) || week.days[0];
    state.ui.selectedWeek = week.number;
    state.ui.selectedDay = day.id;
    const session = sessionForSelection();
    const completion = weekCompletionPercent(cycle, week.number);

    const weekPills = cycle.weeks.map(w => `<button class="pill ${w.number === week.number ? 'active' : ''}" data-action="select-week" data-week="${w.number}">W${w.number}</button>`).join('');
    const dayPills = week.days.map(d => {
      const done = completedDaysForWeek(cycle.id, week.number).has(d.id);
      return `<button class="pill ${d.id === day.id ? 'active' : ''}" data-action="select-day" data-day="${esc(d.id)}">${esc(d.id)}${done ? ' ✓' : ''}</button>`;
    }).join('');

    root.innerHTML = `
      <header class="page-header">
        <span class="eyebrow">Current cycle</span>
        <h1>Train and log</h1>
        <p>Targets adjust by week; actual sets, reps, and RIR drive the next-session suggestion.</p>
      </header>
      <div class="pill-row">${weekPills}</div>
      <div class="pill-row">${dayPills}</div>
      <section class="card accent">
        <div class="week-hero">
          <div>
            <span class="badge accent">W${week.number} · ${esc(week.block)}</span>
            <h2>${esc(day.title)}</h2>
            <p>${esc(week.note)}</p>
          </div>
          <div class="progress-ring" style="--p:${completion}"><span>${completion}%</span></div>
        </div>
        <div class="card-actions" style="margin-top:12px">
          <span class="badge">${esc(week.rirLabel)}</span>
          <span class="badge">${day.prescriptions.length} exercises</span>
          <span class="badge">${day.prescriptions.reduce((s,p)=>s+Number(p.sets),0)} sets</span>
        </div>
        ${renderSessionControls(session, cycle, week, day)}
      </section>
      <div class="section-title"><h2>${session ? 'Workout log' : 'Session preview'}</h2><small>${session && session.status === 'completed' ? 'Completed ' + fmtDate(session.date) : C.todayISO()}</small></div>
      <div id="exercise-list">${session ? renderSessionExercises(session) : renderPrescriptionPreview(day)}</div>
      ${session && session.status !== 'completed' ? `
        <section class="card" style="margin-top:12px">
          <div class="field"><label for="session-notes">Session notes</label><textarea id="session-notes" class="textarea" data-input="session-notes" placeholder="Equipment changes, pain-free range, technique cue...">${esc(session.notes || '')}</textarea></div>
        </section>` : ''}
    `;
    persist(false);
  }

  function renderSessionControls(session, cycle, week, day) {
    if (!session) {
      return `<div class="workout-controls">
        <button class="button primary" data-action="start-session">Start session</button>
        <button class="button" data-action="preview-suggestions">View suggestions</button>
      </div>`;
    }
    if (session.status === 'completed') {
      return `<div class="session-banner"><div><small>Completed</small><strong>${C.formatDuration(session.durationSec)}</strong></div><button class="button small" data-action="repeat-session">Repeat</button></div>`;
    }
    const elapsed = state.activeTimer && state.activeTimer.sessionId === session.id ? C.currentElapsedSeconds(state.activeTimer) : Number(session.durationSec) || 0;
    const paused = Boolean(state.activeTimer && state.activeTimer.pausedAt);
    return `<div class="session-banner">
      <div><small>${paused ? 'PAUSED' : session.status === 'draft' ? 'READY' : 'SESSION TIME'}</small><strong data-live-session-time>${C.formatDuration(elapsed)}</strong></div>
      <div class="card-actions">
        ${session.status === 'draft' ? `<button class="button small primary" data-action="start-existing-session">Begin</button>` : `<button class="button small" data-action="${paused ? 'resume-session' : 'pause-session'}">${paused ? 'Resume' : 'Pause'}</button>`}
        <button class="button small secondary" data-action="finish-session">Finish</button>
      </div>
    </div>`;
  }

  function renderPrescriptionPreview(day) {
    return day.prescriptions.map((p, i) => {
      const ex = C.getExercise(state, p.exerciseId);
      return `<article class="card exercise-card">
        <div class="exercise-head"><div class="exercise-index"><span class="exercise-number">${i + 1}</span><div class="exercise-title"><h3>${esc(ex ? ex.name : p.displayName)}</h3><div class="meta"><span class="badge">${C.prescriptionTargetText(p)}</span><span class="badge">${C.rirText(p)}</span></div></div></div><button class="exercise-menu" data-action="prescription-menu" data-prescription="${esc(p.id)}" aria-label="Exercise options">•••</button></div>
      </article>`;
    }).join('');
  }

  function renderSessionExercises(session) {
    return session.exercises.map((se, i) => renderExerciseCard(session, se, i)).join('');
  }

  function renderExerciseCard(session, se, index) {
    const ex = C.getExercise(state, se.exerciseId);
    const suggestion = C.calculateSuggestion(state, session.cycleId, session.week, session.dayId, se.exerciseId) || se.suggestion;
    se.suggestion = suggestion;
    const completed = C.completedWorkingSets(se).length;
    const target = se.target;
    const setRows = se.sets.map((set, idx) => {
      const sug = suggestion && suggestion.perSet ? suggestion.perSet[Math.min(idx, suggestion.perSet.length - 1)] : null;
      const weightPh = sug && sug.weight != null ? String(sug.weight) : 'weight';
      const repsPh = sug && sug.reps != null ? String(sug.reps) : `${target.repMin}-${target.repMax}`;
      return `<div class="set-row ${set.completed ? 'complete' : ''}" data-set-row="${esc(set.id)}">
        <span class="set-number">${set.isExtra ? '+' : idx + 1}</span>
        <input class="set-input" inputmode="decimal" type="number" step="any" min="0" placeholder="${esc(weightPh)}" value="${esc(set.weight)}" data-set-field="weight" data-session="${esc(session.id)}" data-exercise="${esc(se.exerciseId)}" data-set="${esc(set.id)}" aria-label="Set ${idx + 1} weight">
        <input class="set-input" inputmode="numeric" type="number" step="1" min="0" placeholder="${esc(repsPh)}" value="${esc(set.reps)}" data-set-field="reps" data-session="${esc(session.id)}" data-exercise="${esc(se.exerciseId)}" data-set="${esc(set.id)}" aria-label="Set ${idx + 1} reps">
        <input class="set-input" inputmode="numeric" type="number" step="1" min="0" max="10" placeholder="RIR" value="${esc(set.rir)}" data-set-field="rir" data-session="${esc(session.id)}" data-exercise="${esc(se.exerciseId)}" data-set="${esc(set.id)}" aria-label="Set ${idx + 1} repetitions in reserve">
        <button class="complete-set" data-action="toggle-set" data-session="${esc(session.id)}" data-exercise="${esc(se.exerciseId)}" data-set="${esc(set.id)}" aria-label="Mark set ${idx + 1} complete"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></button>
      </div>`;
    }).join('');
    const setDelta = suggestion && suggestion.setDelta ? `<span class="set-change">${suggestion.setDelta > 0 ? '+' : ''}${suggestion.setDelta} set${Math.abs(suggestion.setDelta) === 1 ? '' : 's'} vs prior week.</span> ` : '';
    return `<article class="card exercise-card" data-exercise-card="${esc(se.exerciseId)}">
      <div class="exercise-head">
        <div class="exercise-index"><span class="exercise-number">${index + 1}</span><div class="exercise-title"><h3>${esc(se.exerciseName || (ex && ex.name) || se.displayName)}</h3><div class="meta"><span class="badge">${C.prescriptionTargetText(target)}</span><span class="badge">${C.rirText(target)}</span><span class="badge ${completed >= Number(target.sets) ? 'success' : ''}">${completed}/${target.sets}</span></div></div></div>
        <button class="exercise-menu" data-action="session-exercise-menu" data-session="${esc(session.id)}" data-exercise="${esc(se.exerciseId)}" aria-label="Exercise options">•••</button>
      </div>
      ${suggestion ? `<div class="suggestion"><strong>${esc(suggestion.headline)}</strong><p>${setDelta}${esc(suggestion.reason)}</p></div>` : ''}
      <div class="set-table"><div class="set-head"><span>Set</span><span>Weight</span><span>Reps</span><span>RIR</span><span>Done</span></div>${setRows}</div>
      <div class="exercise-foot">
        <button class="button small ghost" data-action="apply-load" data-session="${esc(session.id)}" data-exercise="${esc(se.exerciseId)}">Use load</button>
        <button class="button small ghost" data-action="add-set" data-session="${esc(session.id)}" data-exercise="${esc(se.exerciseId)}">+ Set</button>
        <button class="button small ghost" data-action="show-guide" data-exercise="${esc(se.exerciseId)}">Guide</button>
      </div>
    </article>`;
  }

  function renderProgram() {
    const root = $('#view-program');
    const cycle = C.getActiveCycle(state);
    if (!cycle) { root.innerHTML = '<div class="empty"><strong>No program</strong>Create a new cycle.</div>'; return; }
    const weekNum = Number(state.ui.selectedWeek || 1);
    const week = C.getWeek(cycle, weekNum) || cycle.weeks[0];
    const completedSessions = state.sessions.filter(s => s.cycleId === cycle.id && s.status === 'completed').length;
    const weekCells = cycle.weeks.map(w => `<button class="week-cell ${w.number === week.number ? 'active' : ''} ${weekCompletionPercent(cycle,w.number)===100?'complete':''}" data-action="program-week" data-week="${w.number}"><strong>W${w.number}</strong><small>${esc(w.block)}</small></button>`).join('');
    const dayDetails = week.days.map((day, idx) => `<details class="program-day" ${idx === 0 ? 'open' : ''}>
      <summary><div><strong>${esc(day.id)} · ${esc(day.title)}</strong><small>${day.prescriptions.reduce((s,p)=>s+Number(p.sets),0)} working sets</small></div><span class="badge">${day.prescriptions.length}</span></summary>
      <div class="program-day-body">${day.prescriptions.map(p => {
        const ex = C.getExercise(state,p.exerciseId);
        return `<div class="program-row"><div><p><strong>${esc(ex ? ex.name : p.displayName)}</strong></p><small>${C.prescriptionTargetText(p)} · ${C.rirText(p)}</small></div><button class="button small" data-action="prescription-menu" data-prescription="${esc(p.id)}" data-week="${week.number}" data-day="${esc(day.id)}">Edit</button></div>`;
      }).join('')}</div>
    </details>`).join('');
    const drafts = state.cycles.filter(c => c.status === 'draft');

    root.innerHTML = `
      <header class="page-header"><span class="eyebrow">Program control</span><h1>${esc(cycle.name)}</h1><p>${esc(cycle.description || '')}</p></header>
      <section class="card accent">
        <div class="card-header"><div><h2>Cycle status</h2><p>${completedSessions} completed sessions · ${cycle.focusGroups.join(' + ') || 'balanced'} focus</p></div><span class="badge success">ACTIVE</span></div>
        <div class="status-grid" style="margin-top:12px">
          <div class="stat"><small>Current week</small><strong>W${week.number}</strong><em>${esc(week.block)}</em></div>
          <div class="stat"><small>Completion</small><strong>${Math.round(completedSessions / 48 * 100)}%</strong><em>${completedSessions}/48 sessions</em></div>
        </div>
        <div class="workout-controls"><button class="button primary" data-action="build-cycle">Build next cycle</button><button class="button" data-action="cycle-list">All cycles (${state.cycles.length})</button></div>
      </section>
      ${drafts.length ? `<section class="card warning"><div class="card-header"><div><h3>${drafts.length} draft cycle${drafts.length===1?'':'s'}</h3><p>Review or activate when ready.</p></div><button class="button small" data-action="cycle-list">Open</button></div></section>` : ''}
      <div class="section-title"><h2>12-week map</h2><small>Tap a week</small></div>
      <div class="week-grid">${weekCells}</div>
      <section class="card" style="margin-top:12px"><div class="card-header"><div><span class="badge accent">W${week.number}</span><h2 style="margin-top:7px">${esc(week.block)}</h2><p>${esc(week.note)}</p></div><span class="badge">${esc(week.rirLabel)}</span></div></section>
      ${dayDetails}
    `;
  }

  function renderVolume() {
    const root = $('#view-volume');
    const cycle = C.getActiveCycle(state);
    if (!cycle) return;
    const weekNum = Number(state.ui.selectedVolumeWeek || state.ui.selectedWeek || 1);
    const vol = C.calculateWeeklyVolume(state, cycle.id, weekNum, volumeMode);
    const groups = Object.entries(vol.group).filter(([,v]) => v.reps > 0 || volumeMode === 'planned');
    const max = Math.max(1, ...groups.map(([,v]) => v.reps));
    const groupBars = groups.map(([name,v]) => `<div class="bar-row"><label>${esc(name)}</label><div class="bar-track"><div class="bar-fill" style="width:${Math.round(v.reps/max*100)}%"></div></div><span class="bar-value">${v.reps} reps</span></div>`).join('');
    const muscles = Object.entries(vol.muscle).filter(([,v]) => v.reps > 0).sort((a,b)=>b[1].reps-a[1].reps);
    const muscleRows = muscles.length ? muscles.map(([name,v]) => `<tr><td>${esc(name)}</td><td>${v.reps}</td><td>${fmt1(v.sets)}</td><td>${esc(C.getMuscleGroup(name))}</td></tr>`).join('') : '<tr><td colspan="4">No completed sets logged for this week.</td></tr>';
    root.innerHTML = `
      <header class="page-header"><span class="eyebrow">Weekly volume</span><h1>Muscle rep count</h1><p>Each completed rep is credited to the muscles mapped to that exercise. Contribution percentages are editable in the exercise library.</p></header>
      <div class="pill-row">${cycle.weeks.map(w=>`<button class="pill ${w.number===weekNum?'active':''}" data-action="volume-week" data-week="${w.number}">W${w.number}</button>`).join('')}</div>
      <section class="card">
        <div class="volume-toggle"><button class="${volumeMode==='completed'?'active':''}" data-action="volume-mode" data-mode="completed">Completed</button><button class="${volumeMode==='planned'?'active':''}" data-action="volume-mode" data-mode="planned">Planned estimate</button></div>
        <div class="inline-note" style="margin-top:12px">Credited reps and credited sets are workload bookkeeping, not a claim that every involved muscle receives an identical stimulus. Primary muscles usually receive 100% credit; assisting muscles receive partial credit.</div>
      </section>
      <div class="section-title"><h2>Muscle groups</h2><small>${volumeMode === 'planned' ? 'Midpoint rep estimate' : 'Actual completed reps'}</small></div>
      <section class="card"><div class="bar-list">${groupBars || '<div class="empty">No data yet.</div>'}</div></section>
      <div class="section-title"><h2>Individual muscles</h2><small>Reps · weighted sets</small></div>
      <section class="card" style="overflow-x:auto"><table class="volume-table"><thead><tr><th>Muscle</th><th>Reps</th><th>Sets</th><th>Group</th></tr></thead><tbody>${muscleRows}</tbody></table></section>
    `;
  }

  function renderCalendar() {
    const root = $('#view-calendar');
    const ym = state.ui.selectedCalendarMonth || C.todayISO().slice(0,7);
    const [year, month] = ym.split('-').map(Number);
    const first = new Date(year, month - 1, 1);
    const offset = state.profile.weekStartsMonday !== false ? (first.getDay() === 0 ? 6 : first.getDay() - 1) : first.getDay();
    const gridStart = new Date(year, month - 1, 1 - offset);
    const visits = C.allGymVisits(state);
    const visitMap = {};
    visits.forEach(v => { (visitMap[v.date] ||= []).push(v); });
    const weekdays = state.profile.weekStartsMonday !== false ? ['M','T','W','T','F','S','S'] : ['S','M','T','W','T','F','S'];
    const days = [];
    for (let i=0;i<42;i+=1) {
      const d=new Date(gridStart); d.setDate(gridStart.getDate()+i); const iso=C.isoDate(d); const entries=visitMap[iso]||[];
      const sec=entries.reduce((s,v)=>s+(Number(v.durationSec)||0),0);
      days.push(`<button class="calendar-day ${d.getMonth()!==month-1?'outside':''} ${iso===C.todayISO()?'today':''} ${entries.length?'has-gym':''}" data-action="calendar-day" data-date="${iso}"><span class="day-num">${d.getDate()}</span>${entries.length?`<span class="dots">${entries.slice(0,3).map(()=>'<span class="dot"></span>').join('')}</span>${sec?`<span class="time">${Math.round(sec/60)}m</span>`:''}`:''}</button>`);
    }
    const stats=C.timeStats(state);
    const series=C.weeklyTimeSeries(state,12); const maxSec=Math.max(1,...series.map(x=>x.seconds));
    const chart=series.map(x=>`<div class="time-bar-wrap" title="${esc(x.label)}: ${Math.round(x.seconds/60)} minutes"><div class="time-bar" style="height:${Math.max(3,Math.round(x.seconds/maxSec*112))}px"></div><small>${esc(x.label)}</small></div>`).join('');
    root.innerHTML=`
      <header class="page-header"><span class="eyebrow">Attendance and time</span><h1>Gym calendar</h1><p>Completed sessions and manual gym visits are retained for weekly, monthly, yearly, and all-time totals.</p></header>
      <section class="status-grid">
        <div class="stat"><small>This week</small><strong>${C.formatDuration(stats.week.seconds)}</strong><em>${stats.week.count} visit${stats.week.count===1?'':'s'}</em></div>
        <div class="stat"><small>This month</small><strong>${C.formatDuration(stats.month.seconds)}</strong><em>${stats.month.count} visit${stats.month.count===1?'':'s'}</em></div>
        <div class="stat"><small>This year</small><strong>${C.formatDuration(stats.year.seconds)}</strong><em>${stats.year.count} visits</em></div>
        <div class="stat"><small>All time</small><strong>${C.formatDuration(stats.all.seconds)}</strong><em>${stats.all.count} visits</em></div>
      </section>
      <div class="section-title"><h2>Last 12 weeks</h2><small>Session time</small></div><section class="card"><div class="time-chart">${chart}</div></section>
      <div class="section-title"><h2>${fmtMonth(ym)}</h2><button class="button small" data-action="add-gym-visit" data-date="${C.todayISO()}">+ Visit</button></div>
      <section class="card">
        <div class="calendar-toolbar"><button class="icon-button" data-action="calendar-prev" aria-label="Previous month">‹</button><strong>${fmtMonth(ym)}</strong><button class="icon-button" data-action="calendar-next" aria-label="Next month">›</button></div>
        <div class="calendar-grid">${weekdays.map(w=>`<div class="calendar-weekday">${w}</div>`).join('')}${days.join('')}</div>
      </section>`;
  }

  function renderMore() {
    const root=$('#view-more');
    const avg7=C.rollingWeightAverage(state,C.todayISO(),7);
    const macros=state.nutritionTargets.slice().sort((a,b)=>String(b.effectiveDate).localeCompare(String(a.effectiveDate)))[0] || {};
    const activeCount=state.exercises.filter(e=>e.active!==false).length;
    root.innerHTML=`
      <header class="page-header"><span class="eyebrow">Tools and settings</span><h1>Manage your system</h1><p>Edit exercises, update targets, review history, and back up everything stored on this device.</p></header>
      <section class="status-grid">
        <div class="stat"><small>7-day weight</small><strong>${avg7==null?'—':avg7.toFixed(1)}</strong><em>${esc(state.profile.unit)}</em></div>
        <div class="stat"><small>Calories</small><strong>${macros.calories||'—'}</strong><em>${macros.protein||'—'} g protein</em></div>
        <div class="stat"><small>Exercises</small><strong>${activeCount}</strong><em>editable</em></div>
        <div class="stat"><small>Cycles</small><strong>${state.cycles.length}</strong><em>${state.cycles.filter(c=>c.status==='draft').length} draft</em></div>
      </section>
      <div class="section-title"><h2>Log and update</h2></div>
      <section class="card list">
        ${moreRow('exercise-library','Exercise library',`${activeCount} active exercises · muscle credits and alternatives`)}
        ${moreRow('log-progress','Weight and measurements',`${state.weighIns.length} weigh-ins · ${state.measurements.length} measurements`)}
        ${moreRow('macro-targets','Calories and macros',`Current: ${macros.calories||'—'} kcal · ${macros.protein||'—'} g protein`)}
        ${moreRow('time-history','Session time history',`${C.timeStats(state).all.count} recorded gym visits`)}
      </section>
      <div class="section-title"><h2>App and data</h2></div>
      <section class="card list">
        ${moreRow('install-app','Install on phone','Offline-capable home-screen app')}
        ${moreRow('export-data','Backup and Excel exports','JSON backup plus CSV files')}
        ${moreRow('settings','Settings','Theme, timers, units, week layout')}
        ${moreRow('about-app','About and volume method','Privacy, calculations, and limitations')}
      </section>`;
  }

  function moreRow(action,title,sub) {
    return `<button class="list-item" data-action="${action}" style="width:100%;border-left:0;border-right:0;border-top:0;background:transparent;color:inherit;text-align:left"><span class="list-copy"><strong>${esc(title)}</strong><small>${esc(sub)}</small></span><span class="list-chevron">›</span></button>`;
  }

  function goToActiveSession() {
    const active = C.getSession(state, state.activeSessionId);
    if (!active) return false;
    if (active.cycleId !== state.activeCycleId) state.activeCycleId = active.cycleId;
    state.ui.selectedWeek = active.week;
    state.ui.selectedDay = active.dayId;
    routeTo('today');
    return true;
  }

  function canStartSession(session) {
    if (!state.activeSessionId || state.activeSessionId === (session && session.id)) return true;
    toast('Another workout is already running. Finish or pause it before starting a different session.', 'error');
    goToActiveSession();
    return false;
  }

  function startExistingSession(session) {
    if (!session || !canStartSession(session)) return;
    const now=Date.now();
    session.status='in_progress'; session.startedAt=session.startedAt||new Date(now).toISOString();
    state.activeSessionId=session.id;
    state.activeTimer={sessionId:session.id,startedAt:now,pausedAt:null,pausedTotalMs:0};
    persist(true);
  }

  function pauseSession() {
    if (!state.activeTimer || state.activeTimer.pausedAt) return;
    state.activeTimer.pausedAt=Date.now(); persist(true);
  }
  function resumeSession() {
    if (!state.activeTimer || !state.activeTimer.pausedAt) return;
    state.activeTimer.pausedTotalMs=(Number(state.activeTimer.pausedTotalMs)||0)+(Date.now()-Number(state.activeTimer.pausedAt));
    state.activeTimer.pausedAt=null; persist(true);
  }

  function confirmFinishSession() {
    const session=C.getSession(state,state.activeSessionId) || sessionForSelection();
    if (!session || session.status==='completed') return;
    const completed=session.exercises.reduce((s,e)=>s+C.completedWorkingSets(e).length,0);
    openModal('Finish session',`<p>You logged <strong>${completed} completed working sets</strong>.</p>
      <div class="form-grid"><div class="field"><label>Readiness (1-5)</label><input id="finish-readiness" class="input" type="number" min="1" max="5" value="${esc(session.readiness)}"></div><div class="field"><label>Session RPE (1-10)</label><input id="finish-rpe" class="input" type="number" min="1" max="10" value="${esc(session.sessionRpe)}"></div></div>
      <div class="modal-footer"><button class="button" data-action="close-modal">Keep training</button><button class="button primary" data-action="confirm-finish">Finish and save</button></div>`,{type:'finish-session',sessionId:session.id});
  }

  function finishSession() {
    const session=C.getSession(state,modalContext && modalContext.sessionId);
    if (!session) return;
    session.readiness=$('#finish-readiness').value;
    session.sessionRpe=$('#finish-rpe').value;
    session.completedAt=new Date().toISOString();
    session.status='completed';
    if (state.activeTimer && state.activeTimer.sessionId===session.id) session.durationSec=C.currentElapsedSeconds(state.activeTimer);
    else if (!session.durationSec && session.startedAt) session.durationSec=Math.max(0,Math.round((Date.now()-new Date(session.startedAt).getTime())/1000));
    state.activeSessionId=null; state.activeTimer=null; state.restTimer=null;
    closeModal(); persist(true); toast('Workout completed and added to the calendar.','success');
  }

  function startRest(seconds, label) {
    const s=Math.max(15,Number(seconds)||90);
    state.restTimer={endsAt:Date.now()+s*1000,durationSec:s,label:label||'Rest'};
    persist(false); updateTimers();
  }

  function completeSet(actionEl) {
    const session=C.getSession(state,actionEl.dataset.session);
    const se=session && session.exercises.find(e=>e.exerciseId===actionEl.dataset.exercise);
    const set=se && se.sets.find(x=>x.id===actionEl.dataset.set);
    if (!set) return;
    if (!set.completed && !(Number(set.reps)>0)) { toast('Enter the reps completed before checking the set.','error'); return; }
    set.completed=!set.completed; set.completedAt=set.completed?new Date().toISOString():null;
    if (set.completed && state.settings.autoStartRest) startRest(se.restSecSnapshot,se.exerciseName);
    persist(true);
  }

  function applySuggestedLoad(sessionId,exerciseId) {
    const session=C.getSession(state,sessionId); const se=session&&session.exercises.find(e=>e.exerciseId===exerciseId); if(!se)return;
    const sug=C.calculateSuggestion(state,session.cycleId,session.week,session.dayId,exerciseId);
    if(!sug||sug.load==null){toast('No prior load is available yet.','error');return;}
    se.sets.forEach((set,i)=>{if(!set.completed)set.weight=sug.perSet[Math.min(i,sug.perSet.length-1)].weight;});
    persist(true); toast('Suggested load filled. Log actual reps after each set.','success');
  }

  function addSet(sessionId,exerciseId) {
    const session=C.getSession(state,sessionId); const se=session&&session.exercises.find(e=>e.exerciseId===exerciseId); if(!se)return;
    se.sets.push({id:C.uid('set'),number:se.sets.length+1,weight:'',reps:'',rir:'',completed:false,completedAt:null,isExtra:true}); persist(true);
  }

  function generateCycle() {
    const parsed=C.parseFocusText($('#cycle-prompt').value);
    const checkedFocus=$$('input[name="focus-group"]:checked',$('#modal-body')).map(x=>x.value);
    const checkedReduce=$$('input[name="reduce-group"]:checked',$('#modal-body')).map(x=>x.value);
    const focus=Array.from(new Set([...parsed.focus,...checkedFocus]));
    const reduce=Array.from(new Set([...parsed.reduce,...checkedReduce])).filter(g=>!focus.includes(g));
    if(!focus.length){toast('Choose at least one priority group.','error');return;}
    const name=$('#cycle-name').value.trim()||`${focus.join(' + ')} Focus Cycle`;
    const cycle=C.generateRefocusCycle(state,{focusGroups:focus,reduceGroups:reduce,name});
    state.cycles.push(cycle); closeModal();persist(true);toast('Draft cycle generated. Open All cycles to review or activate.','success');
  }

  function saveExercise() {
    const name=$('#ex-name').value.trim(); if(!name){toast('Exercise name is required.','error');return;}
    const muscles=$$('[data-credit-row]',$('#modal-body')).map(row=>({muscle:$('[data-credit-muscle]',row).value,credit:Math.max(0,Math.min(1,Number($('[data-credit-value]',row).value||0)/100))})).filter(m=>m.credit>0);
    if(!muscles.length){toast('Add at least one muscle credit above 0%.','error');return;}
    const obj={name,category:$('#ex-category').value,equipment:$('#ex-equipment').value.trim(),pattern:$('#ex-pattern').value.trim(),restSec:Number($('#ex-rest').value)||90,increment:Number($('#ex-increment').value)||0,cues:$('#ex-cues').value.trim(),alternatives:$('#ex-alts').value.split(',').map(x=>x.trim()).filter(Boolean),muscles,active:$('#ex-active').value==='true'};

    closeModal();persist(true);toast('Exercise saved. Its muscle mapping will count in future sessions.','success');
  }
